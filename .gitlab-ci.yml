test_sdk:
  stage: test
  timeout: 2h 30m
  script:
    - apt-get -y update --fix-missing 
    - apt-get install -y --fix-missing git build-essential pkg-config zlib1g-dev libglib2.0-0 libglib2.0-dev libpixman-1-dev autoconf automake libtool flex bison make
    #- apt-get install -y python3-pip
    - apt-get install -y software-properties-common
    - apt-get install wget openssl libssl-dev -y
    - wget http://www.python.org/ftp/python/3.6.4/Python-3.6.4.tgz
    - tar -xvzf Python-3.6.4.tgz
    - cd Python-3.6.4
    - ./configure --with-ssl
    - make -j8 && make install
    - which python3
    - rm /usr/bin/python && ln -s /usr/local/bin/python3 /usr/bin/python
    - ln -s -f /usr/local/python3/bin/pip3  /usr/bin/pip3  && ln -s -f /usr/local/bin/pip3 /usr/bin/pip
    # find qemu and gcc
    - cd $CI_PROJECT_DIR
    - export QEMU_PATH_LINUX=$(readlink -f linux_qemu/bin)
    - export PATH=$QEMU_PATH_LINUX:$PATH
    - export PATH=$CI_PROJECT_DIR/tools/gcc/gcc/bin:$PATH
    - qemu-system-riscv32 -M ?
    - riscv-nuclei-elf-gcc -v
    ################################################
    - cd $CI_PROJECT_DIR/tools/sdk/nuclei-sdk
    - pip3 install -r tools/scripts/requirements.txt
    - python3 tools/scripts/nsdk_cli/nsdk_bench.py --appcfg tools/scripts/nsdk_cli/configs/application.json --hwcfg tools/scripts/nsdk_cli/configs/nuclei_fpga_eval_ci_qemu.json --parallel=-j --logdir logs/nuclei_fpga_eval_qemu_ci --run --run_target "qemu"
  tags:
    - os::linux
    - env::docker
  image: ubuntu:16.04
  allow_failure: true
  artifacts:
    when: always
    paths:
    - $CI_PROJECT_DIR/tools/sdk/nuclei-sdk/logs/

test_nmsis:
  stage: test
  timeout: 2h 30m
  script:
    - apt-get -y update --fix-missing 
    - apt-get install -y --fix-missing cmake git build-essential pkg-config zlib1g-dev libglib2.0-0 libglib2.0-dev libpixman-1-dev autoconf automake libtool flex bison make
    #- apt-get install -y python3-pip
    - apt-get install -y software-properties-common
    - apt-get install wget openssl libssl-dev -y
    - wget http://www.python.org/ftp/python/3.6.4/Python-3.6.4.tgz
    - tar -xvzf Python-3.6.4.tgz
    - cd Python-3.6.4
    - ./configure --with-ssl
    - make -j8 && make install
    - which python3
    - rm /usr/bin/python && ln -s /usr/local/bin/python3 /usr/bin/python
    - ln -s -f /usr/local/python3/bin/pip3  /usr/bin/pip3  && ln -s -f /usr/local/bin/pip3 /usr/bin/pip
    # find qemu and gcc
    - cd $CI_PROJECT_DIR
    - export QEMU_PATH_LINUX=$(readlink -f linux_qemu/bin)
    - export PATH=$QEMU_PATH_LINUX:$PATH
    - export PATH=$CI_PROJECT_DIR/tools/gcc/gcc/bin:$PATH
    - qemu-system-riscv32 -M ?
    - riscv-nuclei-elf-gcc -v
    ############################################################
    - cd $CI_PROJECT_DIR/tools/NMSIS/NMSIS/nuclei-sdk
    - pip3 install -r tools/scripts/requirements.txt
    - cd $CI_PROJECT_DIR/tools/NMSIS/
    - export NUCLEI_SDK_ROOT=$(readlink -f NMSIS/nuclei-sdk)
    - export NUCLEI_SDK_NMSIS=$(readlink -f NMSIS)
    - export NMSIS_LOGS=$NUCLEI_SDK_NMSIS/Logs
    - mkdir $NMSIS_LOGS
    - source NMSIS/env.sh
    - cd $CI_PROJECT_DIR/tools/NMSIS/NMSIS
    - python3 $NUCLEI_SDK_ROOT/tools/scripts/nsdk_cli/nsdk_bench.py --appcfg Scripts/Runner/nmsis_dsp.json --logdir $NMSIS_LOGS/nmsis_dsp --parallel=-j --run_target qemu --run
    - python3 $NUCLEI_SDK_ROOT/tools/scripts/nsdk_cli/nsdk_bench.py --appcfg Scripts/Runner/nmsis_nn.json  --logdir $NMSIS_LOGS/nmsis_nn  --parallel=-j --run_target qemu --run
  tags:
    - os::linux
    - env::docker
  image: ubuntu:16.04
  allow_failure: true
  artifacts:
    when: always
    paths:
    - $CI_PROJECT_DIR/tools/NMSIS/NMSIS/Logs

deploy-qemu:
  stage: deploy
  script:
    - echo "This job deploys something from the $CI_COMMIT_BRANCH branch."
    - ls -al
    - apt-get update
    - apt-get -y install zip
    - cp $CI_PROJECT_DIR/tools/qemu.wiki/nuclei-qemu-版本发布说明.md windows_qemu/readme.md
    - cp $CI_PROJECT_DIR/tools/qemu.wiki/nuclei-qemu-版本发布说明.md linux_qemu/readme.md

    - mkdir -p windows_qemu_fold
    - mkdir -p linux_qemu_fold
    # windows qemu
    - cd $CI_PROJECT_DIR
    - cp windows_qemu windows_qemu_fold -r
    - cd $CI_PROJECT_DIR/windows_qemu_fold
    - mv windows_qemu qemu
    - cd qemu 
    - mkdir doc
    - cp $CI_PROJECT_DIR/tools/qemu.wiki/NUCLEI-QEMU-用户手册.pdf doc/nuclei_qemu_user_guide.pdf
    - cd ../
    - zip -r nuclei-qemu-2022.04-win32-x64.zip   qemu
    - cp nuclei-qemu-2022.04-win32-x64.zip $CI_PROJECT_DIR/
    # linux qemu
    - cd $CI_PROJECT_DIR
    - cp linux_qemu linux_qemu_fold -r
    - cd $CI_PROJECT_DIR/linux_qemu_fold
    - mv linux_qemu qemu
    - cd qemu 
    - mkdir doc
    - cp $CI_PROJECT_DIR/tools/qemu.wiki/NUCLEI-QEMU-用户手册.pdf doc/nuclei_qemu_user_guide.pdf
    - cd ../
    - tar -zcvf nuclei-qemu-2022.04-linux-x64.tar.gz   qemu
    - cp nuclei-qemu-2022.04-linux-x64.tar.gz $CI_PROJECT_DIR/
    # save log
    - mkdir $CI_PROJECT_DIR/test_logs
    - mkdir $CI_PROJECT_DIR/Documents
    - cp $CI_PROJECT_DIR/tools/sdk/nuclei-sdk/logs/ $CI_PROJECT_DIR/test_logs/ -r

    # docs
    #- git clone git@gito.corp.nucleisys.com:software/riscv-gnu-toolchain/qemu.wiki.git
    - cp $CI_PROJECT_DIR/tools/qemu.wiki/*pdf $CI_PROJECT_DIR/Documents -r
    - cp $CI_PROJECT_DIR/tools/qemu.wiki/nuclei-qemu-版本发布说明.md $CI_PROJECT_DIR/Documents -r
  tags:
    - env::docker
    - net::outside
  artifacts:
    name: "${CI_JOB_NAME}_${CI_COMMIT_REF_NAME}_$(date +%Y%m%d)"
    paths:
    - $CI_PROJECT_DIR/nuclei-qemu-2022.04-win32-x64.zip
    - $CI_PROJECT_DIR/nuclei-qemu-2022.04-linux-x64.tar.gz
    - $CI_PROJECT_DIR/test_logs/
    - $CI_PROJECT_DIR/Documents
