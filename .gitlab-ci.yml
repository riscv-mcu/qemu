before_script:
  - uname -a
  - cat /etc/issue

build_windows_qemu:
  stage: build
  tags:
    - os::linux
    - env::docker
  image: 
    name: fedora
    entrypoint: ["/bin/sh", "-c"]
  script:
    # install software
    # - dnf install updates
    - dnf install -y git mingw64-pixman mingw64-gmp mingw64-SDL2 mingw64-pkg-config mingw64-bzip2 bzip2 make diffutils
    - dnf install -y http://ftp.pbone.net/mirror/archive.fedoraproject.org/fedora-secondary/releases/28/Everything/ppc64/os/Packages/m/mingw64-glib2-2.54.1-1.fc28.noarch.rpm
    - dnf install -y meson ninja-build
    - dnf install -y meson gcc
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - git submodule update --remote
    - sync
    # build
    - mkdir $CI_PROJECT_DIR/build -p
    - mkdir $CI_PROJECT_DIR/windows_qemu -p
    - cd build
    - ../configure --disable-werror --cross-prefix=x86_64-w64-mingw32- --target-list=riscv32-softmmu,riscv64-softmmu --prefix=$CI_PROJECT_DIR/windows_qemu && make -j8 && make install 
    - cp /usr/x86_64-w64-mingw32/sys-root/mingw/bin/* $CI_PROJECT_DIR/windows_qemu
  artifacts:
    paths:
    - $CI_PROJECT_DIR/windows_qemu

build_linux_qemu:
  stage: build
  tags:
    - os::linux
    - env::docker
  image: ubuntu:16.04
  script:
    #install software
    - mv /etc/apt/sources.list /etc/apt/sources.list.bak
    #echo "deb-src http://archive.ubuntu.com/ubuntu xenial main restricted" >/etc/apt/sources.list && \
    - echo "deb http://mirrors.tuna.tsinghua.edu.cn/ubuntu/ xenial main restricted" >>/etc/apt/sources.list
    - echo "deb http://mirrors.tuna.tsinghua.edu.cn/ubuntu/ xenial-updates main restricted" >>/etc/apt/sources.list
    - echo "deb http://mirrors.tuna.tsinghua.edu.cn/ubuntu/ xenial universe" >>/etc/apt/sources.list
    - echo "deb http://mirrors.tuna.tsinghua.edu.cn/ubuntu/ xenial-updates universe" >>/etc/apt/sources.list
    - echo "deb http://mirrors.tuna.tsinghua.edu.cn/ubuntu/ xenial multiverse" >>/etc/apt/sources.list
    - echo "deb http://mirrors.tuna.tsinghua.edu.cn/ubuntu/ xenial-updates multiverse" >>/etc/apt/sources.list
    - echo "deb http://mirrors.tuna.tsinghua.edu.cn/ubuntu/ xenial-backports main restricted universe multiverse" >>/etc/apt/sources.list
    - echo "deb http://mirrors.tuna.tsinghua.edu.cn/ubuntu/ xenial-security main restricted" >>/etc/apt/sources.list
    - echo "deb http://mirrors.tuna.tsinghua.edu.cn/ubuntu/ xenial-security universe" >>/etc/apt/sources.list
    - echo "deb http://mirrors.tuna.tsinghua.edu.cn/ubuntu/ xenial-security multiverse" >>/etc/apt/sources.list
    #echo "deb http://archive.canonical.com/ubuntu xenial partner" >>/etc/apt/sources.list && \
    #echo "deb-src http://archive.canonical.com/ubuntu xenial partner" >>/etc/apt/sources.list && \
    - apt-get update --fix-missing
    - apt-get install -y git build-essential pkg-config zlib1g-dev libglib2.0-0 libglib2.0-dev libsdl1.2-dev libpixman-1-dev libfdt-dev autoconf automake libtool librbd-dev libaio-dev flex bison make 
    # ninja-build
    - apt-get install -y software-properties-common
    - add-apt-repository ppa:deadsnakes/ppa
    - apt-get update --fix-missing
    - apt-get install -y python3.6
    - update-alternatives --install /usr/bin/python python /usr/bin/python2.7 1
    - update-alternatives --install /usr/bin/python python /usr/bin/python3.6 2
    - rm /usr/bin/python && ln -s /usr/bin/python3.6 /usr/bin/python && rm /usr/bin/python3 && ln -s /usr/bin/python3.6 /usr/bin/python3
    - apt-get install -y python3-pip
    - pip3 install pip
    - pip3 install --upgrade pip
    - rm /usr/bin/pip3 && ln -s -f /usr/local/bin/pip3 /usr/bin/pip3 && ln -s -f /usr/local/bin/pip3 /usr/bin/pip
    - pip3 install ninja
    - pip3 install meson==0.57.2
    - git submodule sync --recursive
    - git submodule update --init --recursive
    - git submodule update --remote
    - sync
    #build
    - mkdir $CI_PROJECT_DIR/build -p
    - mkdir $CI_PROJECT_DIR/linux_qemu -p
    - cd build
    - ../configure --prefix=$CI_PROJECT_DIR/linux_qemu --target-list=riscv32-softmmu,riscv64-softmmu && make -j8 && make install
    - ls $CI_PROJECT_DIR/linux_qemu/bin -al
    - find / -name "libpng12.so.0"
  artifacts:
    paths:
    - $CI_PROJECT_DIR/linux_qemu


test_sdk:
  stage: test
  script:
    - export QEMU_PATH_LINUX=$(readlink -f linux_qemu/bin)
    - export PATH=$QEMU_PATH_LINUX:$PATH
    - module load nucleisys/riscv-nuclei-elf-gcc
    #- source .ci/build_sdk.sh
    #- source .ci/build_applications.sh
    - cd $CI_PROJECT_DIR
    - git clone git@gito.corp.nucleisys.com:zhaofujin/ci_test.git
    #- cp $CI_PROJECT_DIR/ci_test/tools/nuclei_riscv_newlibc_prebuilt_linux64_2020.08.tar.bz2 $CI_PROJECT_DIR/nuclei_riscv_newlibc_prebuilt_linux64_2020.08.tar.bz2
    #- tar xvf nuclei_riscv_newlibc_prebuilt_linux64_2020.08.tar.bz2
    # gcc
    #- export PATH=/home/xl_ci/gitlab-runner/builds/5YSmsSSK/0/software/riscv-gnu-toolchain/qemu/gcc/bin/:$PATH
    # qemu
    ################################################
    # start build nuclei-sdk
    - git clone git@gito.corp.nucleisys.com:software/library/nuclei-sdk.git
    - cd nuclei-sdk
    #- echo "NUCLEI_TOOL_ROOT=/home/xl_ci/gitlab-runner/builds/5YSmsSSK/0/software/riscv-gnu-toolchain/qemu/" > setup_config.sh
    #- source setup.sh
    #- echo $PATH
    - pip3 install -r tools/scripts/requirements.txt
    - python3 tools/scripts/nsdk_cli/nsdk_bench.py --appcfg tools/scripts/nsdk_cli/configs/application.json --hwcfg tools/scripts/nsdk_cli/configs/nuclei_fpga_eval_ci_qemu.json --parallel=-j --logdir logs/nuclei_fpga_eval_qemu_ci --run --run_target "qemu"
  tags:
    - env::native
    - host::xls01
  allow_failure: true
  artifacts:
    when: always
    paths:
    - $CI_PROJECT_DIR/nuclei-sdk/logs/

test_cmsis_5:
  stage: test
  script:
    # - module load nucleisys/riscv-nuclei-elf-gcc
    - export QEMU_PATH_LINUX=$(readlink -f linux_qemu/bin)
    - export PATH=$QEMU_PATH_LINUX:$PATH
    - cd $CI_PROJECT_DIR
    - export PATH=/home/xl_ci/toolchain/nuclei_gnu/linux64/newlibc/2021.02-rvvp/gcc/bin/:$PATH
    ################################################
    # start build nuclei-sdk
    - git clone git@gito.corp.nucleisys.com:software/library/cmsis-5-riscv.git
    - cd cmsis-5-riscv
    - git checkout dev_nuclei_vector
    # build lib
    - cd CMSIS
    - git clone git@gito.corp.nucleisys.com:software/library/nuclei-sdk.git
    - export NUCLEI_SDK_ROOT=$(readlink -f nuclei-sdk)
    #- make VEVTOR_SUPPORTED_CORES="" release
    - make PARELLEL=1 gen
    - make PARELLEL=1 release_code
    - make PARELLEL=1 build_release
    #- make strip
    - export NUCLEI_SDK_NMSIS=$(readlink -f nmsis_release/NMSIS)
    - sed -i 's/LENGTH = 64K/LENGTH = 4M/g' nuclei-sdk/SoC/demosoc/Board/nuclei_fpga_eval/Source/GCC/gcc_demosoc_ilm.ld
    - git clone git@gito.corp.nucleisys.com:snippets/3.git
    - cp 3/nuclei_cmsis_5_ci_qemu.json .
    - cd nmsis_release/NMSIS/NN/NN_Lib_Tests
    - make gen
    - cd $CI_PROJECT_DIR/cmsis-5-riscv
    - pip3 install -r CMSIS/nuclei-sdk/tools/scripts/requirements.txt
    - python3 CMSIS/nuclei-sdk/tools/scripts/nsdk_cli/nsdk_bench.py --appcfg CMSIS/nuclei_cmsis_5_ci_qemu.json --parallel=-j --logdir logs/dsp --run --run_target "qemu"
    # test vector=on dsp=on
    - git clone git@gito.corp.nucleisys.com:snippets/4.git
    - cp 4/Makefile.soc.demosoc CMSIS/nuclei-sdk/Build/Makefile.soc.demosoc
    - cp CMSIS/3/nuclei_cmsis_5_ci_qemu_vector.json CMSIS/
    - python3 CMSIS/nuclei-sdk/tools/scripts/nsdk_cli/nsdk_bench.py --appcfg CMSIS/nuclei_cmsis_5_ci_qemu_vector.json --parallel=-j --logdir logs/vector_on_dsp_on --run --run_target "qemu"
    # test vector=on dsp=off
    - cp CMSIS/3/nuclei_cmsis_5_ci_qemu_vector_on_dsp_off.json CMSIS/
    - python3 CMSIS/nuclei-sdk/tools/scripts/nsdk_cli/nsdk_bench.py --appcfg CMSIS/nuclei_cmsis_5_ci_qemu_vector_on_dsp_off.json --parallel=-j --logdir logs/vector_on_dsp_off --run --run_target "qemu"
    # test vector=off dsp=off
    - cp CMSIS/3/nuclei_cmsis_5_ci_qemu_vector_off_dsp_off.json CMSIS/
    - python3 CMSIS/nuclei-sdk/tools/scripts/nsdk_cli/nsdk_bench.py --appcfg CMSIS/nuclei_cmsis_5_ci_qemu_vector_off_dsp_off.json --parallel=-j --logdir logs/vector_off_dsp_off --run --run_target "qemu"
  tags:
    - env::native
    - host::xls01
  allow_failure: true
  artifacts:
    when: always
    paths:
    - $CI_PROJECT_DIR/cmsis-5-riscv/logs/

test_nmsis:
  stage: test
  script:
    - export QEMU_PATH_LINUX=$(readlink -f linux_qemu/bin)
    - export PATH=$QEMU_PATH_LINUX:$PATH
    - module load nucleisys/riscv-nuclei-elf-gcc
    #- source .ci/build_sdk.sh
    #- source .ci/build_applications.sh
    - cd $CI_PROJECT_DIR
    - git clone git@gito.corp.nucleisys.com:zhaofujin/ci_test.git
    #- cp $CI_PROJECT_DIR/ci_test/tools/nuclei_riscv_newlibc_prebuilt_linux64_2020.08.tar.bz2 $CI_PROJECT_DIR/nuclei_riscv_newlibc_prebuilt_linux64_2020.08.tar.bz2
    #- tar xvf nuclei_riscv_newlibc_prebuilt_linux64_2020.08.tar.bz2
    # gcc
    #- export PATH=/home/xl_ci/gitlab-runner/builds/5YSmsSSK/0/software/riscv-gnu-toolchain/qemu/gcc/bin/:$PATH
    ################################################
    # start build nuclei-sdk
    - git clone git@gito.corp.nucleisys.com:software/library/nuclei-sdk.git
    - cd nuclei-sdk
    #- echo "NUCLEI_TOOL_ROOT=/home/xl_ci/gitlab-runner/builds/5YSmsSSK/0/software/riscv-gnu-toolchain/qemu/" > setup_config.sh
    #- source setup.sh
    #- echo $PATH
    - pip3 install -r tools/scripts/requirements.txt
    #- python3 tools/scripts/nsdk_cli/nsdk_bench.py --appcfg tools/scripts/nsdk_cli/configs/application.json --hwcfg tools/scripts/nsdk_cli/configs/nuclei_fpga_eval_ci_qemu.json --parallel=-j --logdir logs/nuclei_fpga_eval_qemu_ci --run --run_target "qemu"
    ################################################
    # start build NMSIS
    - cd $CI_PROJECT_DIR
    - git clone git@gito.corp.nucleisys.com:snippets/1.git
    - git clone git@gito.corp.nucleisys.com:software/library/NMSIS.git
    - cd NMSIS/NMSIS/
    # build dsp lib
    - make gen_dsp_lib
    - make strip_dsp_lib
    # build nn lib
    - make gen_nn_lib
    - make strip_nn_lib
    - export NUCLEI_SDK_ROOT=$CI_PROJECT_DIR/nuclei-sdk
    - export NUCLEI_SDK_NMSIS=$CI_PROJECT_DIR/NMSIS/NMSIS/
    - export SOC=demosoc
    - sed -i 's/LENGTH = 64K/LENGTH = 4M/g' $CI_PROJECT_DIR/nuclei-sdk/SoC/demosoc/Board/nuclei_fpga_eval/Source/GCC/gcc_demosoc_ilm.ld
    - cd $CI_PROJECT_DIR/nuclei-sdk
    - cp $CI_PROJECT_DIR/1/application.json $CI_PROJECT_DIR/nuclei-sdk/tools/scripts/nsdk_cli/configs/
    - cd $CI_PROJECT_DIR/NMSIS/NMSIS/NN/NN_Lib_Tests/
    - make gen
    - cd $CI_PROJECT_DIR/
    - python3 nuclei-sdk/tools/scripts/nsdk_cli/nsdk_bench.py --appcfg nuclei-sdk/tools/scripts/nsdk_cli/configs/application.json --parallel=-j --logdir logs/nuclei_fpga_ci_nmsis_qemu --run --run_target "qemu"
  tags:
    - env::native
    - host::xls01
  allow_failure: true
  artifacts:
    when: always
    paths:
    - $CI_PROJECT_DIR/logs/

deploy-qemu:
  stage: deploy
  script:
    - echo "This job deploys something from the $CI_COMMIT_BRANCH branch."
    - ls -al
    - tar -zcvf windows_qemu.tar.gz windows_qemu
    - tar -zcvf linux_qemu.tar.gz   linux_qemu
    # save log
    - mkdir $CI_PROJECT_DIR/test_logs
    - cp $CI_PROJECT_DIR/logs/ $CI_PROJECT_DIR/test_logs/ -r
    - cp $CI_PROJECT_DIR/cmsis-5-riscv/logs/ $CI_PROJECT_DIR/test_logs/ -r
    - cp $CI_PROJECT_DIR/nuclei-sdk/logs/ $CI_PROJECT_DIR/test_logs/ -r
  tags:
    - env::native
    - host::xls01
  artifacts:
    name: "${CI_JOB_NAME}_${CI_COMMIT_REF_NAME}"
    paths:
    - $CI_PROJECT_DIR/windows_qemu.tar.gz
    - $CI_PROJECT_DIR/linux_qemu.tar.gz
    - $CI_PROJECT_DIR/test_logs/
