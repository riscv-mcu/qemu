before_script:
  - uname -a
  - cat /etc/issue

prepare_tools:
  stage: build
  timeout: 2h 30m
  script:
    - echo "hello world"
    - mkdir -p $CI_PROJECT_DIR/tools/
    - cd $CI_PROJECT_DIR/tools/
    # docs
    - git clone git@gito.corp.nucleisys.com:software/riscv-gnu-toolchain/qemu.wiki.git
    # gcc
    - mkdir -p $CI_PROJECT_DIR/tools/gcc
    # /home/xl_ci/toolchain//nuclei_gnu/linux64/newlibc/2021.1215.eng1/gcc
    #- cp /home/xl_ci/toolchain/nuclei_gnu/linux64/newlibc/2021.11-eng1/gcc/ gcc/ -r
    # 2021.07-eng1
    - cp /home/xl_ci/toolchain/nuclei_gnu/linux64/newlibc/2022.04/gcc/ gcc/ -r
    #- cp /home/xl_ci/toolchain/nuclei_gnu/linux64/newlibc/2021.09-rvp-eng2-linux/gcc/ gcc/ -r
    - export PATH=$CI_PROJECT_DIR/tools/gcc/gcc/bin:$PATH
    # test sdk
    - mkdir -p $CI_PROJECT_DIR/tools/sdk
    - cd $CI_PROJECT_DIR/tools/sdk
    - git clone git@gito.corp.nucleisys.com:software/library/nuclei-sdk.git
    - cd nuclei-sdk
    # nmsis
    - cd  $CI_PROJECT_DIR/tools/
    - git clone git@gito.corp.nucleisys.com:software/library/NMSIS.git
    - cd $CI_PROJECT_DIR/tools/NMSIS/NMSIS
    - git clone git@gito.corp.nucleisys.com:software/library/nuclei-sdk.git
    - cd nuclei-sdk
    - git checkout dev_xlspike_next
    - sed -i "s/64K/1M/g" SoC/demosoc/Board/nuclei_fpga_eval/Source/GCC/gcc_demosoc_ilm.ld
    - cd $CI_PROJECT_DIR/tools/NMSIS/NMSIS/
    # build dsp lib
    - make gen
    #- make strip_dsp_lib
    # build nn lib
    - make gen_unalign
    #- make strip_nn_lib
    - cd $CI_PROJECT_DIR/tools/NMSIS/NMSIS/nuclei-sdk
    - pip3 install -r tools/scripts/requirements.txt
    - cd $CI_PROJECT_DIR/tools/NMSIS/
    - export NUCLEI_SDK_ROOT=$(readlink -f NMSIS/nuclei_sdk)
    - export NUCLEI_SDK_NMSIS=$(readlink -f NMSIS)
    - source NMSIS/env.sh
    - export SILENT=1
    - cd NMSIS
    - make gen
    - make gen_nnref_lib
    #git submodule
    - cd $CI_PROJECT_DIR/tools
    - git clone git@gito.corp.nucleisys.com:software/qemu/internal-submudule.git
    - cd $CI_PROJECT_DIR
    - cp $CI_PROJECT_DIR/tools/qemu_submodule .gitmodules
  tags:
    - env::native
    - host::xls01
  allow_failure: true
  artifacts:
    when: always
    paths:
    - $CI_PROJECT_DIR/tools/


